services:

  # ─────────────────────────────────────────
  # YOUR BACKEND
  # ─────────────────────────────────────────

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend
    restart: unless-stopped
    networks:
      - app_net
      - shared_net
    # ports:
    #   - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://booking_user:booking_pass@bk_postgres:5432/booking_db
      - BLNK_API_URL=http://server:5001
      - HYPERSWITCH_API_URL=http://hyperswitch-server-1:8080
    env_file:
    - ./backend/.env
    depends_on:
      bk_postgres:
        condition: service_healthy

  bk_postgres:
    image: postgres:16
    container_name: bk_postgres
    restart: always
    networks:
      - app_net
    environment:
      - POSTGRES_USER=booking_user
      - POSTGRES_PASSWORD=booking_pass
      - POSTGRES_DB=booking_db
    ports:
      - "5434:5432"
    volumes:
      - bk_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U booking_user -d booking_db"]
      interval: 5s
      retries: 5
      start_period: 5s
      timeout: 5s


  # ─────────────────────────────────────────
  # BLNK
  # ─────────────────────────────────────────

  server:
    image: ${BLNK_IMAGE:-jerryenebeli/blnk:latest}
    container_name: server
    restart: on-failure
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "blnk migrate up && blnk start"
    environment:
      TZ: ${TZ:-Etc/UTC}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      TYPESENSE_URL: http://typesense:8108
    ports:
      - "5001:5001"
      - "80:80"
      - "443:443"
    depends_on:
      - redis
      - postgres
      - jaeger
    volumes:
      - ./BLNK/blnk.json:/blnk.json
    networks:
      - app_net
      - shared_net

  worker:
    image: ${BLNK_IMAGE:-jerryenebeli/blnk:latest}
    container_name: worker
    restart: on-failure
    entrypoint: ["blnk", "workers"]
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    ports:
      - "5004:5004"
    depends_on:
      - redis
      - postgres
      - jaeger
    volumes:
      - ./BLNK/blnk.json:/blnk.json
    networks:
      - app_net

  redis:
    image: redis:latest
    container_name: redis
    networks:
      - app_net

  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16}
    container_name: ${POSTGRES_CONTAINER:-postgres}
    restart: on-failure
    ports:
      - "${POSTGRES_OUTER_PORT:-5433}:5432"
    environment:
      TZ: ${TZ:-Etc/UTC}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-blnk}
    volumes:
      - blnk_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app_net

  typesense:
    image: typesense/typesense:30.2.rc1
    container_name: typesense
    command:
      ["--data-dir", "/data", "--api-key=blnk-api-key", "--listen-port", "8108"]
    volumes:
      - typesense_data:/data
    logging:
      driver: "none"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8108/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - app_net

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: jaeger
    ports:
      - "16686:16686" # Jaeger UI
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:16686"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - app_net

  # ─────────────────────────────────────────
  # NGINX
  # ─────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: unless-stopped
    networks:
      - app_net
      - shared_net
    ports:
      # - "80:80"       # HTTP → redirects to HTTPS
      - "3443:443"     # Backend
      - "8443:8443"   # Hyperswitch
      - "5443:5443"   # Blnk
      - "9443:9443"   # Control Center
      - "9450:9450"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - backend
      - server
