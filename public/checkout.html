<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Marrakech Booking Payment</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <!-- Payment form -->
    <form class="checkout-card" id="checkout-card">
      <h1>Complete Your Payment</h1>
      <div id="payment-element"></div>
      <button type="submit" id="pay-button">Pay Now</button>
    </form>

    <div id="payment-message"></div>

    <!-- Load the Hyperswitch loader from CDN -->
    <script src="http://localhost:9050/HyperLoader.js"></script>
    <script>
      let hyper;
      let unifiedCheckout;

      async function initialize() {
        try {
          const resp = await fetch("http://localhost:3000/create-booking", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              amount: 1400,
              user_id: "11111111-1111-1111-1111-111111111111",
              host_id: "22222222-2222-2222-2222-222222222222"
            }),
          });

          const data = await resp.json();
          console.log("RESPONSE:", data);

          const { bookingId, clientSecret } = data;
          hyper = Hyper("pk_snd_d12b2e3fde784c5886f0f3038f57a3e5");

          const elements = hyper.elements({ clientSecret });

          unifiedCheckout = elements.create("payment");
          unifiedCheckout.mount("#payment-element");

          document.getElementById("checkout-card").dataset.bookingId = bookingId;

        } catch (err) {
          console.error("Initialization failed:", err);
        }
      }

      async function handleSubmit(event) {
        event.preventDefault();
        console.log("LOOOCATION: ", window.location.origin)
        const { error, status } = await hyper.confirmPayment({
          elements: unifiedCheckout,
          confirmParams: {
            return_url: window.location.origin + "/payment-complete.html",
          },
          redirect: "always",
        });
        
        if (error) {
          document.getElementById("payment-message").textContent =
            error.message || "Payment failed. Please try again.";
        }
      }

      document
        .getElementById("checkout-card")
        .addEventListener("submit", handleSubmit);

      initialize();
    </script>
  </body>
</html>
